<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FakeBreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #26215C;
    --ink-2: #3C3489;
    --violet: #7F77DD;
    --violet-soft: #EEEDFE;
    --coral: #F0997B;
    --coral-dark: #D85A30;
    --mint: #5DCAA5;
    --paper: #FFFFFF;
    --muted: #6B6890;
    --red: #E24B4A;
    --red-soft: #FCEBEB;
    --red-dark: #791F1F;
    --green: #1D9E75;
    --green-soft: #E1F5EE;
    --green-dark: #085041;
    --amber: #EF9F27;
    --amber-soft: #FAEEDA;
    --amber-dark: #633806;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rubik', system-ui, sans-serif;
    background: #E9E7F5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .phone {
    width: 100%;
    max-width: 390px;
    height: 780px;
    max-height: calc(100vh - 48px);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    background: var(--paper);
    border: 10px solid #111;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: 48px 24px 32px;
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  .logo { font-weight: 700; direction: ltr; display: inline-flex; align-items: center; gap: 8px; }
  .logo .fake { text-decoration: line-through; text-decoration-color: var(--coral); text-decoration-thickness: 4px; }
  .logo .break { color: var(--coral); }
  .bolt { width: 1em; height: 1em; fill: var(--coral); }

  .btn {
    font-family: inherit;
    border: none;
    cursor: pointer;
    border-radius: 16px;
    font-weight: 500;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--coral); color: var(--ink); font-size: 20px; padding: 18px; width: 100%; }

  /* Language */
  #lang { background: var(--ink); color: #fff; gap: 14px; }
  #lang .logo { font-size: 30px; justify-content: center; margin-bottom: 16px; }
  #lang h1 { font-size: 26px; font-weight: 500; text-align: center; }
  #lang .hint { font-size: 15px; color: #AFA9EC; text-align: center; margin-bottom: 8px; }
  .lang-btn {
    font-family: inherit;
    background: var(--ink-2);
    color: #fff;
    border: 2px solid transparent;
    border-radius: 18px;
    padding: 16px 20px;
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lang-btn:hover { border-color: var(--coral); }
  .lang-btn span { font-size: 14px; color: #AFA9EC; font-weight: 400; }
  #lang .note { font-size: 13px; color: #8A85C9; text-align: center; margin-top: auto; }

  /* Intro guide (story-style animated scenes) */
  #intro { background: var(--ink); color: #fff; padding: 20px 20px 32px; gap: 16px; cursor: pointer; user-select: none; }
  .story-bar { display: flex; gap: 4px; direction: ltr; }
  .story-bar span { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; }
  .story-bar span i { display: block; height: 100%; width: 0; background: var(--coral); }
  .story-bar span.done i { width: 100%; }
  .story-bar span.now i { animation: storyfill var(--scene-ms) linear forwards; }
  @keyframes storyfill { to { width: 100%; } }
  .intro-top { display: flex; justify-content: space-between; align-items: center; }
  .intro-top .logo { font-size: 20px; }
  .skip { font-family: inherit; background: none; border: 1px solid var(--violet); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
  .scene { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
  .scene-art { width: 220px; height: 220px; animation: popin .5s ease-out; }
  .scene-text { font-size: 24px; font-weight: 500; line-height: 1.4; max-width: 300px; animation: rise .6s ease-out; }
  /* Transform only, no opacity: if animations are paused (background tab, power saving) the scene still shows. */
  @keyframes popin { from { transform: scale(.75); } }
  @keyframes rise { from { transform: translateY(16px); } }
  .a-pulse { animation: pulse 1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .a-up { animation: up 1.4s ease-in-out infinite; }
  @keyframes up { 0% { transform: translateY(30px); } 100% { transform: translateY(-20px); } }
  .a-scan { animation: scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(120px); } }
  .a-blink { animation: blink 1.6s ease-in-out infinite; }
  .a-blink.d2 { animation-delay: .5s; } .a-blink.d3 { animation-delay: 1s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .a-swap1 { animation: swap 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .a-swap2 { animation: swap 2.4s ease-in-out infinite reverse; transform-origin: center; transform-box: fill-box; }
  @keyframes swap { 0%, 45% { opacity: 1; transform: scale(1); } 55%, 100% { opacity: 0; transform: scale(.7); } }
  .a-draw { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.8s ease-out infinite; }
  @keyframes draw { 60%, 100% { stroke-dashoffset: 0; } }
  .watch-intro { font-family: inherit; background: none; border: none; color: #AFA9EC; text-decoration: underline; font-size: 15px; cursor: pointer; margin-bottom: 12px; }

  /* Welcome */
  #welcome { background: var(--ink); color: #fff; justify-content: space-between; text-align: center; }
  #welcome .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  #welcome .logo { font-size: 44px; }
  #welcome .tagline { font-size: 22px; color: var(--violet-soft); }
  #welcome .sub { font-size: 16px; color: #AFA9EC; line-height: 1.6; max-width: 280px; }

  /* Phone login and one-time code */
  #login, #code { background: var(--violet-soft); color: var(--ink); gap: 16px; }
  #login h1, #code h1 { font-size: 28px; }
  #login .hint, #code .hint { font-size: 16px; color: var(--muted); line-height: 1.5; }
  .field {
    font-family: inherit;
    width: 100%;
    border: 2px solid var(--violet);
    border-radius: 18px;
    background: #fff;
    color: var(--ink);
    padding: 16px;
    font-size: 24px;
    direction: ltr;
    text-align: center;
  }
  .field:focus { outline: none; border-color: var(--coral); }
  .phone-row { display: flex; gap: 8px; direction: ltr; }
  .phone-row .field { min-width: 0; }
  .field.country { flex: 0 0 118px; font-size: 20px; padding: 16px 6px; cursor: pointer; }
  #code-input { font-size: 32px; letter-spacing: 12px; font-weight: 500; }
  .demo-code { background: var(--amber-soft); color: var(--amber-dark); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
  .demo-code b { direction: ltr; unicode-bidi: isolate; font-size: 18px; letter-spacing: 2px; }
  .form-err { color: var(--red); font-size: 15px; min-height: 1.2em; }
  .links { display: flex; justify-content: space-between; gap: 12px; }
  .link-btn { font-family: inherit; background: none; border: none; color: var(--ink-2); font-size: 15px; text-decoration: underline; cursor: pointer; padding: 4px 0; }
  #login .btn-primary, #code .btn-primary { margin-top: auto; }

  /* Age choice */
  #age { background: var(--violet-soft); color: var(--ink); gap: 16px; }
  #age h1 { font-size: 28px; }
  #age .hint { font-size: 16px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .choice {
    background: #fff;
    border: 2px solid transparent;
    border-radius: 20px;
    padding: 18px;
    text-align: start;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .choice:hover { border-color: var(--violet); }
  .choice .age-num { font-size: 22px; font-weight: 700; min-width: 84px; text-align: center; }
  .choice .what { font-size: 15px; color: var(--muted); line-height: 1.4; }
  .choice .what b { display: block; font-size: 18px; color: var(--ink); font-weight: 500; }
  #age .note { font-size: 14px; color: var(--muted); text-align: center; margin-top: auto; }

  /* Home: simple */
  #home-simple { background: #fff; color: #1a1a1a; gap: 20px; }
  #home-simple .top { display: flex; justify-content: space-between; align-items: center; }
  #home-simple .logo { font-size: 26px; color: var(--ink); }
  #home-simple h1 { font-size: 32px; line-height: 1.3; }
  .drop-simple {
    flex: 1;
    min-height: 220px;
    border: 4px dashed var(--violet);
    border-radius: 28px;
    background: var(--violet-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 26px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
    padding: 16px;
  }
  .drop-simple svg { width: 72px; height: 72px; stroke: var(--ink); }
  .btn-text-simple { background: #fff; color: var(--ink); border: 3px solid var(--violet); font-size: 22px; padding: 18px; width: 100%; }

  /* Home: detailed */
  #home-pro { background: var(--ink); color: #fff; gap: 18px; }
  #home-pro .top { display: flex; justify-content: space-between; align-items: center; }
  #home-pro .logo { font-size: 22px; }
  #home-pro h1 { font-size: 22px; font-weight: 500; }
  .scan-options { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }

  /* Recording */
  #record { align-items: center; text-align: center; gap: 20px; }
  #record.simple { background: #fff; color: var(--ink); }
  #record.pro { background: var(--ink); color: #fff; }
  #record .top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; }
  #record.simple .switch { border: 2px solid var(--violet); color: var(--ink); font-size: 16px; }
  #record.pro .switch { border: 1px solid var(--violet); color: #fff; }
  #record h1 { font-size: 28px; }
  #record .hint { font-size: 16px; line-height: 1.5; color: var(--muted); }
  #record.pro .hint { color: #AFA9EC; }
  .mic {
    width: 150px; height: 150px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--coral); display: flex; align-items: center; justify-content: center; margin-top: 16px;
  }
  .mic svg { width: 64px; height: 64px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mic.on { background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
  .mic.on svg { stroke: #fff; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  #rec-time { font-size: 36px; font-weight: 700; direction: ltr; }
  #rec-label { font-size: 20px; font-weight: 500; }
  #rec-err { color: var(--red); font-size: 15px; min-height: 1.2em; }
  .drop-pro {
    border: 2px dashed var(--violet);
    border-radius: 20px;
    padding: 22px 12px;
    text-align: center;
    background: var(--ink-2);
    cursor: pointer;
    color: #fff;
    font-family: inherit;
  }
  .drop-pro .big { font-size: 17px; font-weight: 500; margin-top: 8px; }
  .drop-pro .small { font-size: 12px; color: #AFA9EC; margin-top: 4px; }
  .drop-pro svg { width: 36px; height: 36px; stroke: var(--coral); fill: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--ink-2); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 700; color: var(--coral); }
  .stat .l { font-size: 12px; color: #AFA9EC; margin-top: 2px; }
  .recent h2 { font-size: 15px; font-weight: 500; color: #AFA9EC; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; background: var(--ink-2); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  .row:hover { border-color: var(--violet); }
  .pill { font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; direction: ltr; }
  .pill.bad { background: #FAECE7; color: #993C1D; }
  .pill.ok { background: #E1F5EE; color: #085041; }
  .pill.maybe { background: var(--amber-soft); color: var(--amber-dark); }

  .switch {
    font-family: inherit;
    background: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    padding: 8px 14px;
  }
  #home-simple .switch, #result-simple .switch, #text.simple .switch { border: 2px solid var(--violet); color: var(--ink); font-size: 16px; }
  #home-pro .switch, #result-pro .switch, #text.pro .switch { border: 1px solid var(--violet); color: #fff; }

  /* Text check */
  #text { gap: 16px; }
  #text .top { display: flex; justify-content: space-between; align-items: center; }
  #text.simple { background: #fff; color: var(--ink); }
  #text.pro { background: var(--ink); color: #fff; }
  #text h1 { font-size: 28px; }
  #text.pro h1 { font-size: 22px; font-weight: 500; }
  #text textarea {
    flex: 1;
    min-height: 200px;
    font-family: inherit;
    border-radius: 20px;
    padding: 16px;
    resize: none;
    line-height: 1.5;
  }
  #text.simple textarea { font-size: 22px; border: 3px solid var(--violet); background: var(--violet-soft); color: var(--ink); }
  #text.pro textarea { font-size: 15px; border: 1px solid var(--violet); background: var(--ink-2); color: #fff; }
  #text textarea::placeholder { color: #8A85C9; }
  #text .hint { font-size: 14px; line-height: 1.5; }
  #text.simple .hint { color: var(--muted); font-size: 16px; }
  #text.pro .hint { color: #AFA9EC; }
  #text .err { color: var(--red); font-size: 15px; min-height: 1em; }
  #text.simple .btn-primary { font-size: 22px; padding: 20px; }

  /* Scanning */
  #scan { align-items: center; justify-content: center; gap: 24px; text-align: center; }
  #scan.simple { background: #fff; color: var(--ink); }
  #scan.pro { background: var(--ink); color: #fff; }
  .spinner { width: 120px; height: 120px; border-radius: 50%; border: 10px solid var(--violet-soft); border-top-color: var(--coral); animation: spin 1s linear infinite; }
  #scan.pro .spinner { border-color: var(--ink-2); border-top-color: var(--coral); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #scan .title { font-size: 28px; font-weight: 500; }
  #scan .file { font-size: 15px; color: var(--muted); }
  #scan.pro .file { color: #AFA9EC; }
  #scan .progress { font-size: 15px; line-height: 1.5; max-width: 280px; }
  #scan.simple .progress { color: var(--muted); font-size: 17px; }
  #scan.pro .progress { color: var(--coral); }
  .steps { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px; text-align: start; min-width: 220px; }
  .steps li { color: #6B6890; }
  .steps li.done { color: var(--mint); }
  .steps li.done::before { content: '✓ '; }
  .steps li.now { color: #fff; }
  .steps li.now::before { content: '● '; color: var(--coral); }

  /* Result: simple */
  #result-simple { background: #fff; color: #1a1a1a; gap: 20px; text-align: center; }
  #result-simple .top { display: flex; justify-content: space-between; align-items: center; }
  #result-simple .logo { font-size: 22px; color: var(--ink); }
  .verdict-card { border-radius: 28px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .verdict-icon { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .verdict-icon svg { width: 72px; height: 72px; stroke: #fff; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .verdict-title { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .verdict-line { font-size: 22px; line-height: 1.5; }
  .v-fake { background: var(--red-soft); color: var(--red-dark); }
  .v-fake .verdict-icon { background: var(--red); }
  .v-real { background: var(--green-soft); color: var(--green-dark); }
  .v-real .verdict-icon { background: var(--green); }
  .v-maybe { background: var(--amber-soft); color: var(--amber-dark); }
  .v-maybe .verdict-icon { background: var(--amber); }
  .btn-big { font-size: 22px; padding: 20px; width: 100%; }
  .btn-share-simple { background: var(--ink); color: #fff; }
  .btn-again-simple { background: var(--violet-soft); color: var(--ink); }

  /* Result: detailed */
  #result-pro { background: var(--ink); color: #fff; gap: 16px; }
  #result-pro .top { display: flex; justify-content: space-between; align-items: center; }
  #result-pro .logo { font-size: 20px; }
  .card { background: var(--ink-2); border-radius: 18px; padding: 16px; }
  .gauge-wrap { display: flex; align-items: center; gap: 16px; }
  .gauge { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; direction: ltr; }
  .gauge .num b { font-size: 28px; }
  .gauge .num span { font-size: 11px; color: #AFA9EC; }
  .gauge-text h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .gauge-text p { font-size: 13px; color: #AFA9EC; line-height: 1.5; }
  .card h2 { font-size: 14px; font-weight: 500; color: #AFA9EC; margin-bottom: 12px; }
  .timeline { position: relative; height: 34px; background: #2E2870; border-radius: 8px; overflow: hidden; direction: ltr; }
  .timeline .seg { position: absolute; top: 0; bottom: 0; background: var(--red); opacity: .85; }
  .timeline-labels { display: flex; justify-content: space-between; font-size: 11px; color: #AFA9EC; margin-top: 6px; direction: ltr; }
  .marks { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .marks div { display: flex; justify-content: space-between; gap: 8px; }
  .marks .t { direction: ltr; color: var(--coral); font-weight: 500; }
  .heat { position: relative; border-radius: 12px; overflow: hidden; line-height: 0; }
  .heat img { width: 100%; display: block; }
  .heat-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); direction: ltr; }
  .heat-grid div { border: 1px solid rgba(255, 255, 255, .15); }
  .heat-note { font-size: 12px; color: #AFA9EC; margin-top: 8px; line-height: 1.5; }
  .web-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; direction: ltr; }
  .web-btns .btn { font-size: 13px; padding: 10px 4px; }
  .bar-row { margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-head .p { direction: ltr; font-weight: 500; }
  .bar { height: 8px; background: #2E2870; border-radius: 99px; overflow: hidden; direction: ltr; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .actions-pro { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-pro { font-size: 15px; padding: 14px; }
  .btn-share-pro { background: var(--coral); color: var(--ink); }
  .btn-again-pro { background: transparent; color: #fff; border: 1px solid var(--violet); }
  .disclaimer { font-size: 11px; color: #8A85C9; text-align: center; line-height: 1.5; }
  .badge-live { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); margin-top: 6px; }
  .badge-demo { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-dark); margin-top: 6px; }

  .toast {
    position: absolute;
    bottom: 28px;
    left: 24px;
    right: 24px;
    background: #111;
    color: #fff;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    font-size: 16px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 5;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="phone">

  <!-- Screen 0: language (always in English) -->
  <section class="screen active" id="lang">
    <div class="logo">
      <svg class="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <span><span class="fake">Fake</span><span class="break">Break</span></span>
    </div>
    <h1>Choose your language</h1>
    <p class="hint">Which language would you like to use?</p>
    <button class="lang-btn" onclick="setLang('he')"><bdi>עברית</bdi><span>Hebrew</span></button>
    <button class="lang-btn" onclick="setLang('en')"><bdi>English</bdi><span>English</span></button>
    <button class="lang-btn" onclick="setLang('ar')"><bdi>العربية</bdi><span>Arabic</span></button>
    <button class="lang-btn" onclick="setLang('ru')"><bdi>Русский</bdi><span>Russian</span></button>
    <p class="note">More languages coming soon</p>
  </section>

  <!-- Screen 0b: intro guide (animated, story-style; tap to skip ahead) -->

  // ---------- Detection engine (runs fully in the browser, files never leave the device) ----------

  const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
  const ORT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.bundle.min.mjs';
  // SwinV2 AI-image detector (haywoodsloan/ai-image-detector-deploy). Output 0 = artificial, 1 = real.
  // Transformers.js doesn't support swinv2 yet, so we run it with ONNX Runtime directly.
  const IMAGE_MODEL_URL = 'https://huggingface.co/LPX55/detection-model-1-ONNX/resolve/main/onnx/model_quantized.onnx';
  const IMAGE_SIZE = 256;
  const IMAGE_MEAN = [0.485, 0.456, 0.406];
  const IMAGE_STD = [0.229, 0.224, 0.225];
  // Second engine: Perception Encoder classifier trained on the newest generators (Nano Banana Pro, FLUX.2,
  // GPT-Image, Imagen 4). Output 0 = fake, 1 = real. Input: shorter side 256, center crop, RGB in [0, 1].
  // On its own it flags too many real photos, so it only turns a "real" verdict into "not sure".
  const PE_MODEL_URL = 'https://huggingface.co/Deckard618/imdet/resolve/main/pe_small/model.onnx';
  // Third engine: Community Forensics ViT (CVPR 2025, trained on 4,803 generators). One logit, sigmoid = fake.
  // Input: shorter side 440, center crop 384, CLIP normalization. Few false alarms on real photos.
  // We use the FP32 export: the card warns its quantized versions can drift a lot.
  const CF_MODEL_URL = 'https://huggingface.co/buildborderless/CommunityForensics-DeepfakeDet-ViT/resolve/main/onnx/model.onnx';
  const CF_MEAN = [0.4815, 0.4578, 0.4082];
  const CF_STD = [0.2686, 0.2613, 0.2758];

  // Text found inside files made by AI tools (IPTC/C2PA "digital source type", generator names, SD parameters).
  const AI_MARKERS = [
    ['compositeWithTrainedAlgorithmicMedia', 'Content Credentials'], ['trainedAlgorithmicMedia', 'Content Credentials'],
    ['Made with Google AI', 'Google'], ['SynthID', 'Google'],
    ['OpenAI', 'OpenAI'], ['DALL-E', 'OpenAI'], ['DALL·E', 'OpenAI'], ['ChatGPT', 'OpenAI'],
    ['Midjourney', 'Midjourney'], ['Adobe Firefly', 'Adobe Firefly'], ['Stable Diffusion', 'Stable Diffusion'],
    ['ComfyUI', 'Stable Diffusion'], ['Negative prompt:', 'Stable Diffusion'], ['NovelAI', 'NovelAI'],
    ['Leonardo.Ai', 'Leonardo'], ['Ideogram', 'Ideogram'], ['Microsoft Designer', 'Microsoft'], ['Bing Image Creator', 'Microsoft'],
    ['ElevenLabs', 'ElevenLabs']
  ];
  // Voice engine: pellav2 (MIT, 95.8% on the Podonos benchmark), converted to ONNX and split into
  // 20 MB parts next to the app. The published checkpoint had 6 damaged tensors; we replaced them with
  // w2v-bert-2.0 base weights (fine-tuning moves weights ~1.5%) and it scored 20/20 on our voice test set.
  // For phones it's 4-bit (MatMulNBits, 369 MB instead of 813 MB int8; still 20/20). That's ~8.5 s per
  // 4-second window in the browser, so we check at most 3 windows.
  // Input: pella.js fbank features [1, T, 160] + attention mask [1, T]; output: one logit (sigmoid = fake).
  const VOICE_MODEL_DIR = 'voice-model/';
  const VOICE_WINDOWS = 3;
  // Speech detector (Silero VAD v5, MIT, 2 MB). pellav2 only knows speech: on music and background noise
  // it said "fake" 92-100%, so we only send it 4-second windows that are mostly speech.
  const VAD_MODEL_URL = 'https://huggingface.co/onnx-community/silero-vad/resolve/main/onnx/model.onnx';
  const VAD_CHUNK = 512;              // 32 ms at 16 kHz
  const MIN_SPEECH_SECONDS = 1.5;
  const TEXT_MODEL = 'onnx-community/tmr-ai-text-detector-ONNX'; // labels: human / ai
  const VIDEO_FRAMES = 8;

  let transformers = null;
  const pipes = {};
  let ort = null;
  let imageSession = null;
  let peSession = null;
  let cfSession = null;

  function downloadProgress(loaded, total) {
    setProgress(t('scan.download', { p: Math.round(loaded / total * 100) }));
  }

  async function getPipe(task, model) {
    if (!transformers) transformers = await import(TRANSFORMERS_URL);
    if (!pipes[model]) {
      const files = {};
      pipes[model] = transformers.pipeline(task, model, {
        dtype: 'q8',
        device: 'wasm',
        progress_callback: p => {
          if (p.status !== 'progress' || !p.total) return;
          files[p.file] = [p.loaded, p.total];
          const [loaded, total] = Object.values(files).reduce((a, [l, tot]) => [a[0] + l, a[1] + tot], [0, 0]);
          downloadProgress(loaded, total);
        }
      }).catch(e => { delete pipes[model]; throw e; });
    }
    return pipes[model];
  }

  // Download a model file once, showing progress, and keep it in the browser cache for next time.
  async function fetchModel(url) {
    const cache = await caches.open('fakebreak-models');
    const hit = await cache.match(url);
    if (hit) return hit.arrayBuffer();
    const res = await fetch(url);
    if (!res.ok) throw new Error('model download failed');
    const total = +res.headers.get('content-length') || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      if (total) downloadProgress(loaded, total);
    }
    const blob = new Blob(chunks);
    try { await cache.put(url, new Response(blob)); } catch (e) { /* storage full: just skip caching */ }
    return blob.arrayBuffer();
  }

  async function loadSession(url) {
    if (!ort) ort = await import(ORT_URL);
    const bytes = await fetchModel(url);
    setProgress(t('scan.preparing'));
    return ort.InferenceSession.create(bytes, { executionProviders: ['wasm'] });
  }

  async function getImageSession() {
    if (!imageSession) imageSession = loadSession(IMAGE_MODEL_URL).catch(e => { imageSession = null; throw e; });
    return imageSession;
  }

  async function getPeSession() {
    if (!peSession) peSession = loadSession(PE_MODEL_URL).catch(e => { peSession = null; throw e; });
    return peSession;
  }

  // Download the voice engine's parts (once; cached afterwards) and join them.
  let voiceSession = null;
  async function getVoiceSession() {
    if (!voiceSession) {
      voiceSession = (async () => {
        if (!ort) ort = await import(ORT_URL);
        const manifest = await (await fetch(VOICE_MODEL_DIR + 'manifest.json')).json();
        const key = new URL(VOICE_MODEL_DIR + 'pellav2-' + manifest.sha256 + '.onnx', location.href).href;
        const cache = await caches.open('fakebreak-models');
        const hit = await cache.match(key);
        let bytes;
        try {
          if (hit) {
            bytes = new Uint8Array(await hit.arrayBuffer());
          } else {
            bytes = new Uint8Array(manifest.size);
            let loaded = 0;
            for (let i = 0; i < manifest.parts; i++) {
              const res = await fetch(VOICE_MODEL_DIR + 'pellav2.part' + String(i).padStart(2, '0'));
              if (!res.ok) throw new Error('HTTP ' + res.status);
              const part = new Uint8Array(await res.arrayBuffer());
              bytes.set(part, loaded);
              loaded += part.length;
              downloadProgress(loaded, manifest.size);
            }
            try { await cache.put(key, new Response(bytes)); } catch (e) { /* storage full: just skip caching */ }
          }
        } catch (e) {
          throw stageError(e instanceof RangeError ? 'memory' : 'download', e);
        }
        setProgress(t('scan.preparing'));
        try {
          return await ort.InferenceSession.create(bytes, { executionProviders: ['wasm'] });
        } catch (e) {
          throw stageError('memory', e);
        }
      })().catch(e => { voiceSession = null; throw e; });
    }
    return voiceSession;
  }

  // Score a voice recording: up to VOICE_WINDOWS evenly spaced 4-second windows, each through pellav2.
  // Returns { duration, windows: [{ start, p }] } with p = probability the voice is AI-made.
  // Errors from the voice check carry a stage, so the result can say what went wrong.
  function stageError(stage, e) {
    const err = new Error(stage + ': ' + (e && e.message || e));
    err.stage = stage;
    return err;
  }

  // Decode any recording/file to 16 kHz mono, resampled exactly like pellav2's Python code (pella.js).
  // WAV files are read directly at their own rate; other formats (recordings, voice notes, video sound)
  // are decoded by the browser at the device's rate (some phones, e.g. iPhones, refuse a 16 kHz context).
  async function decodeVoice(file) {
    const buf = await file.arrayBuffer();
    const wav = pellaParseWav(buf);
    if (wav) return pellaResample(wav.mono, wav.rate, PELLA_SR);
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    let audio;
    try {
      audio = await ctx.decodeAudioData(buf);
    } finally {
      ctx.close();
    }
    const mono = new Float32Array(audio.length);
    for (let c = 0; c < audio.numberOfChannels; c++) {
      const ch = audio.getChannelData(c);
      for (let i = 0; i < ch.length; i++) mono[i] += ch[i] / audio.numberOfChannels;
    }
    return pellaResample(mono, audio.sampleRate, PELLA_SR);
  }

  let vadSession = null;
  async function getVadSession() {
    if (!vadSession) {
      vadSession = (async () => {
        if (!ort) ort = await import(ORT_URL);
        return ort.InferenceSession.create(await fetchModel(VAD_MODEL_URL), { executionProviders: ['wasm'] });
      })().catch(e => { vadSession = null; throw e; });
    }
    return vadSession;
  }

  // Speech probability for every 32 ms of 16 kHz audio (Silero v5: 512 samples + 64 samples of context).
  async function speechProbs(x) {
    const vad = await getVadSession();
    let state = new ort.Tensor('float32', new Float32Array(2 * 128), [2, 1, 128]);
    const sr = new ort.Tensor('int64', BigInt64Array.from([BigInt(PELLA_SR)]), []);
    let context = new Float32Array(64);
    const probs = [];
    for (let s = 0; s + VAD_CHUNK <= x.length; s += VAD_CHUNK) {
      const chunk = new Float32Array(64 + VAD_CHUNK);
      chunk.set(context, 0);
      chunk.set(x.subarray(s, s + VAD_CHUNK), 64);
      const out = await vad.run({ input: new ort.Tensor('float32', chunk, [1, chunk.length]), state, sr });
      probs.push(out.output.data[0]);
      state = out.stateN;
      context = x.slice(s + VAD_CHUNK - 64, s + VAD_CHUNK);
    }
    return probs;
  }

  // Pick up to VOICE_WINDOWS non-overlapping 4-second windows with the most speech (at least half speech).
  // Returns sample offsets. A clip of 4 s or less is one window (the minimum-speech check ran already).
  function speechWindows(probs) {
    const perWin = PELLA_CROP / VAD_CHUNK;
    const speech = probs.map(p => (p > 0.5 ? 1 : 0));
    if (speech.length <= perWin) return [0];
    const candidates = [];
    for (let c = 0; c + perWin <= speech.length; c += Math.round(perWin / 4)) {
      const frac = speech.slice(c, c + perWin).reduce((a, b) => a + b, 0) / perWin;
      if (frac >= 0.5) candidates.push({ start: c * VAD_CHUNK, frac });
    }
    candidates.sort((a, b) => b.frac - a.frac);
    const picked = [];
    for (const cnd of candidates) {
      if (picked.length >= VOICE_WINDOWS) break;
      if (picked.every(p => Math.abs(p.start - cnd.start) >= PELLA_CROP)) picked.push(cnd);
    }
    return picked.map(p => p.start).sort((a, b) => a - b);
  }

  async function scoreVoice(file) {
    let mono;
    try {
      mono = await decodeVoice(file);
    } catch (e) {
      throw stageError('decode', e);
    }
    if (mono.length < PELLA_SR / 2) throw stageError('short', 'under half a second');

    // Only speech goes to the voice engine.
    setProgress(t('scan.vad'));
    let probs;
    try {
      probs = await speechProbs(mono);
    } catch (e) {
      throw stageError('download', e);
    }
    const speechSeconds = probs.filter(p => p > 0.5).length * VAD_CHUNK / PELLA_SR;
    if (speechSeconds < MIN_SPEECH_SECONDS) throw stageError('nospeech', speechSeconds.toFixed(1) + ' s of speech');
    const starts = speechWindows(probs);
    if (!starts.length) throw stageError('nospeech', 'no window with enough speech');
    const session = await getVoiceSession();
    const windows = [];
    for (let i = 0; i < starts.length; i++) {
      setProgress(t('scan.voice', { i: i + 1, n: starts.length }));
      const f = pellaFeatures(pellaPrep(mono.subarray(starts[i], starts[i] + PELLA_CROP)));
      let out;
      try {
        out = await session.run({
          input_features: new ort.Tensor('float32', f.data, [1, f.frames, 160]),
          attention_mask: new ort.Tensor('int64', new BigInt64Array(f.frames).fill(1n), [1, f.frames])
        });
      } catch (e) {
        throw stageError('run', e);
      }
      const z = out[session.outputNames[0]].data[0];
      windows.push({ start: starts[i] / PELLA_SR, p: 1 / (1 + Math.exp(-z)) });
    }
    return { duration: mono.length / PELLA_SR, windows };
  }

  async function getCfSession() {
    if (!cfSession) cfSession = loadSession(CF_MODEL_URL).catch(e => { cfSession = null; throw e; });
    return cfSession;
  }

  function softmaxFirst(logits) {
    const [a, b] = logits;
    const m = Math.max(a, b);
    return Math.exp(a - m) / (Math.exp(a - m) + Math.exp(b - m));
  }

  // Camera make/model from a JPEG's EXIF data (e.g. "Apple iPhone 15"), or null.
  // AI images almost never have it; WhatsApp and screenshots strip it from real photos too.
  function cameraModel(buf) {
    const v = new DataView(buf);
    if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 10 < v.byteLength) {
      const marker = v.getUint16(o);
      if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) return null;
      const len = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) { // "Exif"
        const tiff = o + 10;
        const le = v.getUint16(tiff) === 0x4949;
        const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
        const ifd = tiff + u32(tiff + 4);
        const found = {};
        for (let i = 0; i < u16(ifd); i++) {
          const e = ifd + 2 + i * 12;
          const tag = u16(e);
          if (tag !== 0x010F && tag !== 0x0110) continue; // Make, Model
          const count = u32(e + 4);
          const at = count > 4 ? tiff + u32(e + 8) : e + 8;
          let s = '';
          for (let k = 0; k < count - 1 && at + k < v.byteLength; k++) s += String.fromCharCode(v.getUint8(at + k));
          found[tag] = s.trim();
        }
        const name = [found[0x010F], found[0x0110]].filter(Boolean).join(' ');
        return name || null;
      }
      o += 2 + len;
    }
    return null;
  }

  // Content Credentials saying the photo was captured by a camera (newer Pixel/Samsung phones add these).
  function hasCaptureCredential(buf) {
    const text = new TextDecoder('latin1').decode(new Uint8Array(buf).subarray(0, 2 * 1024 * 1024));
    return text.includes('digitalCapture');
  }

  // Name of the AI tool if the file carries an AI label in its metadata, else null.
  function findAiMarker(buf) {
    const bytes = new Uint8Array(buf);
    const latin1 = new TextDecoder('latin1');
    const text = latin1.decode(bytes.subarray(0, 2 * 1024 * 1024)) + latin1.decode(bytes.subarray(Math.max(0, bytes.length - 256 * 1024)));
    const hit = AI_MARKERS.find(([marker]) => text.includes(marker));
    return hit ? hit[1] : null;
  }

  // Probability (0..1) that the input is AI-made, from a classifier's label scores.
  function aiProb(output, aiLabel, humanLabel) {
    const find = l => output.find(o => o.label.toLowerCase() === l);
    const ai = find(aiLabel);
    if (ai) return ai.score;
    const human = find(humanLabel);
    return human ? 1 - human.score : 0.5;
  }

  // Draw a region of an image ([sx, sy, sw, sh], default: all of it) into an N×N canvas and return
  // its RGB pixels as a CHW float tensor. `cover` keeps the aspect ratio and center-crops; otherwise it stretches.
  function toTensor(img, N, cover, mean = [0, 0, 0], std = [1, 1, 1], region = null) {
    const [sx, sy, sw, sh] = region || [0, 0, img.naturalWidth, img.naturalHeight];
    const canvas = document.createElement('canvas');
    canvas.width = N;
    canvas.height = N;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (cover) {
      const scale = N / Math.min(sw, sh);
      const w = sw * scale, h = sh * scale;
      ctx.drawImage(img, sx, sy, sw, sh, (N - w) / 2, (N - h) / 2, w, h);
    } else {
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, N, N);
    }
    const px = ctx.getImageData(0, 0, N, N).data;
    const data = new Float32Array(3 * N * N);
    for (let i = 0; i < N * N; i++) {
      for (let c = 0; c < 3; c++) data[c * N * N + i] = (px[i * 4 + c] / 255 - mean[c]) / std[c];
    }
    return new ort.Tensor('float32', data, [1, 3, N, N]);
  }

  // AI probability (0..1) from all three engines: { main, second, third }.
  async function scoreImage(src) {
    const [main, second, third] = await Promise.all([getImageSession(), getPeSession(), getCfSession()]);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = src;
    await img.decode();
    // Community Forensics wants the shorter side at 440 then a 384 center crop: same as a 384 "cover" of a 440/384-zoomed region.
    const W = img.naturalWidth, H = img.naturalHeight, k = 384 / 440;
    const cfRegion = [(W - W * k) / 2, (H - H * k) / 2, W * k, H * k];
    const a = await main.run({ pixel_values: toTensor(img, IMAGE_SIZE, false, IMAGE_MEAN, IMAGE_STD) });
    const b = await second.run({ [second.inputNames[0]]: toTensor(img, 256, true) });
    const c = await third.run({ [third.inputNames[0]]: toTensor(img, 384, true, CF_MEAN, CF_STD, cfRegion) });
    return {
      main: softmaxFirst(a.logits.data),
      second: softmaxFirst(b[second.outputNames[0]].data),
      third: 1 / (1 + Math.exp(-c[third.outputNames[0]].data[0]))
    };
  }

  // Combine the three engines (and the patch scan) into a displayed percentage and verdict.
  // Tested on 50 images (25 AI, 25 real) plus a real user's AI patio photo:
  // - 2 of 3 engines agree → "fake".
  // - Only 1 engine suspicious → "not sure", unless the others are confidently real
  //   (Community Forensics under 5%, second engine under 70%, no suspicious patch) and the main
  //   engine isn't very sure (under 90%) → "real". (Sora video frames: main 99-100%, the others ~0.)
  // - A suspicious full-resolution patch alone → "not sure".
  // Never show 0% or 100%: no detector is certain.
  function combine({ main, second, third }, patchSuspicious = false) {
    const clamp = p => Math.min(98, Math.max(2, Math.round(p)));
    const scores = [main, second, third];
    const votes = scores.filter(p => p >= 0.5);
    if (votes.length >= 2) return { pct: clamp(Math.max(70, votes.reduce((a, b) => a + b) / votes.length * 100)), verdict: 'fake' };
    if (votes.length === 1 && third < 0.05 && second < 0.7 && main < 0.9 && !patchSuspicious) return { pct: clamp(Math.min(30, main * 100)), verdict: 'real' };
    if (votes.length === 1) return { pct: clamp(31 + (votes[0] - 0.5) * 2 * 38), verdict: 'maybe', split: true };
    if (patchSuspicious) return { pct: 55, verdict: 'maybe', patch: true };
    return { pct: clamp(Math.min(30, scores.reduce((a, b) => a + b) / scores.length * 100)), verdict: 'real' };
  }

  // Patch scan at full resolution. Shrinking a big image to 256px for the whole-image check can wipe out
  // AI traces, so we also look at 12 small 256px patches (4×3 grid) without shrinking them.
  // The fast second engine scores every patch (that's the heatmap); the main engine re-checks the 2 most
  // suspicious ones. A patch counts as suspicious only when both engines flag it at 70%+.
  const PATCH_COLS = 4, PATCH_ROWS = 3, PATCH_THRESHOLD = 0.7;

  async function patchScan(src) {
    const [main, second] = await Promise.all([getImageSession(), getPeSession()]);
    const img = new Image();
    img.src = src;
    await img.decode();
    const W = img.naturalWidth, H = img.naturalHeight, S = Math.min(256, W, H);
    const patches = [];
    for (let r = 0; r < PATCH_ROWS; r++) {
      for (let c = 0; c < PATCH_COLS; c++) {
        const region = [c * (W - S) / (PATCH_COLS - 1), r * (H - S) / (PATCH_ROWS - 1), S, S];
        const out = await second.run({ [second.inputNames[0]]: toTensor(img, 256, true, undefined, undefined, region) });
        patches.push({ region, second: softmaxFirst(out[second.outputNames[0]].data), main: null });
      }
    }
    const top = [...patches].sort((a, b) => b.second - a.second).slice(0, 2);
    for (const p of top) {
      const out = await main.run({ pixel_values: toTensor(img, IMAGE_SIZE, false, IMAGE_MEAN, IMAGE_STD, p.region) });
      p.main = softmaxFirst(out.logits.data);
    }
    const flagged = p => p.main != null && p.main >= PATCH_THRESHOLD && p.second >= PATCH_THRESHOLD;
    return { cells: patches.map(p => ({ p: p.second, flagged: flagged(p) })), suspicious: patches.some(flagged) };
  }

  // Grab evenly spaced frames from a video file as JPEG data URLs.
  async function videoFrames(file, n) {
    const v = document.createElement('video');
    v.muted = true;
    v.preload = 'auto';
    v.src = URL.createObjectURL(file);
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('video')); });
    // Seek and wait, but never hang: some files never fire "seeked" for odd positions.
    const seek = at => new Promise(r => {
      const done = () => { clearTimeout(timer); v.onseeked = null; r(); };
      const timer = setTimeout(done, 5000);
      v.onseeked = done;
      v.currentTime = at;
    });
    // Recordings made in a browser (and some phone videos) have no duration in their header.
    // Seeking far past the end makes the browser scan the file and fill it in.
    if (!isFinite(v.duration)) {
      await seek(1e7);
      if (!isFinite(v.duration)) throw new Error('video duration unknown');
    }
    const canvas = document.createElement('canvas');
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d');
    const frames = [];
    for (let i = 0; i < n; i++) {
      const at = v.duration * (i + 0.5) / n;
      await seek(at);
      ctx.drawImage(v, 0, 0);
      frames.push({ t: at, url: canvas.toDataURL('image/jpeg', 0.92) });
    }
    URL.revokeObjectURL(v.src);
    return { duration: v.duration, frames };
  }

  function verdictFor(pct) { return pct >= 70 ? 'fake' : pct <= 30 ? 'real' : 'maybe'; }
  function verdictLine(kind, verdict) {
    if (verdict === 'maybe') return t('line.maybe');
    return t(`line.${kind}.${verdict}`);
  }

  function buildResult(kind, fileName, pct, extra = {}) {
    const verdict = extra.verdict || verdictFor(pct);
    return Object.assign({
      kind, file: fileName, verdict, pct, live: true,
      simpleTitle: t('v.simple.' + verdict),
      simpleLine: verdictLine(kind, verdict),
      proTitle: t('v.pro.' + verdict),
      proSub: t('sub.live'),
      total: null, segments: [], marks: [], bars: []
    }, extra);
  }

  async function analyzeFile(file) {
    const isAudio = file.type.startsWith('audio') || /\.(opus|ogg|m4a|mp3|wav|aac)$/i.test(file.name);
    const kind = isAudio ? 'voice' : file.type.startsWith('video') ? 'video' : 'image';
    showScanning(file.name, t(kind === 'video' ? 'scan.video' : 'scan.connecting'));
    try {
      // 1. AI label inside the file: when present, it's the most reliable signal there is.
      const buf = await file.arrayBuffer();
      const label = findAiMarker(buf);
      const labelled = label ? {
        verdict: 'fake',
        simpleLine: t('line.label'),
        proSub: t('sub.label', { src: label })
      } : {};

      // Voice: pellav2 runs on the device. If the engine can't load (e.g. not enough memory on an older
      // phone), fall back to the AI label check and say honestly that we couldn't check the voice.
      if (kind === 'voice') {
        let v = null, failure = null;
        try {
          v = await scoreVoice(file);
        } catch (e) {
          console.error(e);
          failure = e.stage || 'run';
        }
        if (!v) {
          // Say exactly what failed, plus the technical message in the detailed view (helps us fix it).
          const why = t('voice.fail.' + failure);
          showResult(buildResult('voice', file.name, label ? 98 : null, label ? { verdict: 'fake', ...labelled } : {
            verdict: 'maybe', simpleTitle: t('voice.st'), simpleLine: why + ' ' + t('voice.sl'), proTitle: t('voice.pt'),
            proSub: why + ' (' + failure + ')'
          }));
          return;
        }
        const mean = v.windows.reduce((a, w) => a + w.p, 0) / v.windows.length;
        const anyFake = v.windows.some(w => w.p >= 0.5);
        const verdict = mean >= 0.5 ? 'fake' : anyFake ? 'maybe' : 'real';
        const pct = Math.min(98, Math.max(2, Math.round(mean * 100)));
        const flagged = v.windows.filter(w => w.p >= 0.5);
        showResult(buildResult('voice', file.name, label ? 98 : pct, {
          verdict,
          proSub: t('sub.voice'),
          total: Math.max(v.duration, 4),
          segments: flagged.map(w => [w.start, Math.min(v.duration, w.start + 4)]),
          marks: flagged.map(w => [w.start, t('mark.window', { p: Math.round(w.p * 100) })]),
          bars: v.windows.map(w => [t('bar.window', { t: fmtTime(w.start) }), Math.round(w.p * 100)]),
          ...labelled
        }));
        return;
      }

      if (kind === 'image') {
        const url = URL.createObjectURL(file);
        const s = await scoreImage(url);
        setProgress(t('scan.heat'));
        const patches = await patchScan(url);
        const heat = patches.cells;
        let c = combine(s, patches.suspicious);
        let proSub = c.split ? t('sub.split') : c.patch ? t('sub.patch') : null;
        const bars = [[t('bar.engine1'), Math.round(s.main * 100)], [t('bar.engine2'), Math.round(s.second * 100)],
          [t('bar.engine3'), Math.round(s.third * 100)], [t('bar.patch'), Math.round(Math.max(...heat.map(h => h.p)) * 100)]];

        // 2. Proof of a real camera: camera credentials settle it; plain EXIF camera details move the verdict one step toward "real".
        const camera = label ? null : cameraModel(buf);
        const captured = !label && hasCaptureCredential(buf);
        if (captured) {
          c = { pct: Math.min(c.pct, 10), verdict: 'real' };
          proSub = t('sub.capture');
        } else if (camera) {
          c = c.verdict === 'fake' ? { pct: 50, verdict: 'maybe' } : { pct: Math.min(c.pct, 15), verdict: 'real' };
          proSub = t('sub.camera', { cam: camera });
          bars.unshift([t('bar.camera'), 100]);
        }
        if (label) bars.unshift([t('bar.label'), 100]);
        if (current && current.preview) URL.revokeObjectURL(current.preview);
        showResult(buildResult('image', file.name, label ? 98 : c.pct, {
          verdict: c.verdict, bars, preview: url, heat, ...(proSub ? { proSub } : {}), ...labelled
        }));
        return;
      }

      const { duration, frames } = await videoFrames(file, VIDEO_FRAMES);
      const scores = [];
      for (let i = 0; i < frames.length; i++) {
        setProgress(t('scan.frame', { i: i + 1, n: frames.length }));
        scores.push(await scoreImage(frames[i].url));
      }
      // Judge each frame on its own, then the video by how many frames look AI. Averaging the engines
      // over all frames hid AI videos: on Sora clips the main engine said 99-100% on nearly every frame,
      // but the average with the other two engines came out "not sure" or even "real".
      // Tested on 2 Sora videos and 3 real videos (8 frames each): all frames of the real videos came out real.
      const perFrame = scores.map(s => combine(s));
      const fakeFrames = perFrame.filter(c => c.verdict === 'fake').length;
      const maybeFrames = perFrame.filter(c => c.verdict === 'maybe').length;
      let verdict = fakeFrames >= Math.max(2, Math.ceil(frames.length / 4)) ? 'fake'
        : fakeFrames >= 1 || maybeFrames >= 2 ? 'maybe' : 'real';
      const meanPct = Math.round(perFrame.reduce((a, c) => a + c.pct, 0) / perFrame.length);
      let pct = verdict === 'fake' ? Math.max(70, meanPct) : verdict === 'maybe' ? Math.min(69, Math.max(31, meanPct)) : Math.min(30, meanPct);
      let proSub = t('sub.frames', { n: fakeFrames + maybeFrames, total: frames.length });
      const half = duration / frames.length / 2;
      const flagged = frames.map((f, i) => ({ ...f, c: perFrame[i] })).filter(f => f.c.verdict !== 'real');
      const segments = flagged.map(f => [Math.max(0, f.t - half), Math.min(duration, f.t + half)]);
      const marks = flagged.map(f => [f.t, t('mark.frame', { p: f.c.pct })]);
      const bars = frames.map((f, i) => [t('bar.frame', { t: fmtTime(f.t) }), perFrame[i].pct]);

      // The voice in the video: many deepfakes pair a real-looking picture with a cloned voice.
      // No audio track or no speech → we simply skip this part.
      let voice = null;
      try { voice = await scoreVoice(file); } catch (e) { console.info('video voice skipped:', e.stage || e); }
      if (voice) {
        const vMean = voice.windows.reduce((a, w) => a + w.p, 0) / voice.windows.length;
        bars.push([t('bar.videoVoice'), Math.round(vMean * 100)]);
        for (const w of voice.windows.filter(w => w.p >= 0.5)) {
          segments.push([w.start, Math.min(duration, w.start + 4)]);
          marks.push([w.start, t('mark.videoVoice', { p: Math.round(w.p * 100) })]);
        }
        // pellav2 separates sharply (0.1% real vs 99.9% fake in our tests), so a confident fake voice
        // (90%+) makes the whole video fake: a cloned voice on real footage is still a deepfake.
        if (vMean >= 0.5) {
          const pictureFake = verdict !== 'real';
          verdict = pictureFake || vMean >= 0.9 ? 'fake' : 'maybe';
          pct = verdict === 'fake' ? Math.max(pct, 70, Math.round(vMean * 100)) : Math.max(pct, 50);
          proSub = t(pictureFake ? 'sub.videoBoth' : verdict === 'fake' ? 'sub.videoVoiceFake' : 'sub.videoVoice');
        }
      }
      marks.sort((a, b) => a[0] - b[0]);

      showResult(buildResult('video', file.name, label ? 98 : Math.min(98, pct), {
        verdict, proSub, total: duration, segments, marks, bars, ...labelled
      }));
    } catch (e) {
      console.error(e);
      goHome();
      toast(t('toast.errFile'));
    }
  }

  // ---------- Text ----------

  function openText() {
    document.getElementById('text').className = 'screen ' + mode;
    document.getElementById('text-title').textContent = t(mode === 'simple' ? 'text.titleSimple' : 'text.titlePro');
    document.getElementById('text-hint').textContent = t(mode === 'simple' ? 'text.hintSimple' : 'text.hintPro');
    document.getElementById('text-err').textContent = '';
    go('text');
  }

  // The text model leans toward "AI": in our tests, casual human messages scored 73-92 and AI text 99.
  // Map raw scores so only 97+ reads as AI (70+), under 60 reads as human (30-), and the rest as "not sure".
  function calibrateText(raw) {
    const lerp = (x, x0, x1, y0, y1) => y0 + (x - x0) / (x1 - x0) * (y1 - y0);
    if (raw >= 97) return Math.round(lerp(raw, 97, 100, 70, 100));
    if (raw >= 60) return Math.round(lerp(raw, 60, 97, 31, 69));
    return Math.round(lerp(raw, 0, 60, 0, 30));
  }

  async function checkText() {
    const text = document.getElementById('text-input').value.trim();
    const err = document.getElementById('text-err');
    if (text.split(/\s+/).length < 15) {
      err.textContent = t('text.short');
      return;
    }
    err.textContent = '';
    showScanning(t('text.name'), t('scan.connecting'));
    try {
      const pipe = await getPipe('text-classification', TEXT_MODEL);
      setProgress(t('scan.text'));
      const out = await pipe(text, { top_k: 2 });
      const pct = calibrateText(aiProb(out, 'ai', 'human') * 100);
      const letters = text.match(/\p{L}/gu) || [];
      const latin = text.match(/[a-zA-Z]/g) || [];
      const extra = { bars: [[t('bar.txtAi'), pct], [t('bar.txtHuman'), 100 - pct]] };
      if (latin.length / Math.max(1, letters.length) < 0.8) {
        // The text model was trained on English, so we never give a confident verdict on other scripts.
        extra.verdict = 'maybe';
        extra.simpleLine = t('text.nonEn.line');
        extra.proSub = t('text.nonEn.sub');
      }
      showResult(buildResult('text', t('text.name'), pct, extra));
    } catch (e) {
      console.error(e);
      openText();
      toast(t('toast.errText'));
    }
  }

  // ---------- Voice recording ----------

  let recorder = null;
  let recTimer = null;

  function openRecord() {
    document.getElementById('record').className = 'screen ' + mode;
    document.getElementById('rec-time').textContent = '0:00';
    document.getElementById('rec-label').textContent = t('rec.start');
    document.getElementById('rec-err').textContent = '';
    document.getElementById('mic-btn').classList.remove('on');
    go('record');
    // Start downloading the voice engine now, so it's ready (or closer) when the recording ends.
    getVoiceSession().catch(() => { /* the check reports the reason if it still fails */ });
  }

  function toggleRecording() {
    if (recorder) stopRecording(true);
    else startRecording();
  }

  async function startRecording() {
    const err = document.getElementById('rec-err');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      err.textContent = t('rec.denied');
      return;
    }
    err.textContent = '';
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(tr => tr.stop());
      if (recorder && recorder.analyze) {
        const type = recorder.mimeType || 'audio/webm';
        analyzeFile(new File([new Blob(chunks, { type })], t('rec.name') + '.webm', { type }));
      }
      recorder = null;
    };
    try {
      recorder.start();
    } catch (e) {
      stream.getTracks().forEach(tr => tr.stop());
      recorder = null;
      err.textContent = t('rec.failed');
      return;
    }
    const started = Date.now();
    recTimer = setInterval(() => {
      document.getElementById('rec-time').textContent = fmtTime((Date.now() - started) / 1000);
    }, 250);
    document.getElementById('mic-btn').classList.add('on');
    document.getElementById('rec-label').textContent = t('rec.stop');
  }

  // Stop the recorder; when `analyze` is true the recording is sent for checking.
  function stopRecording(analyze) {
    clearInterval(recTimer);
    document.getElementById('mic-btn').classList.remove('on');
    if (!recorder) return;
    recorder.analyze = analyze;
    recorder.stop();
  }

  // ---------- Screens ----------

  function pickFile() {
    const input = document.getElementById('file-input');
    input.value = '';
    input.onchange = () => { if (input.files[0]) analyzeFile(input.files[0]); };
    input.click();
  }

  function showScanning(fileName, progress) {
    document.getElementById('scan').className = 'screen ' + mode;
    document.getElementById('scan-title').textContent = t(mode === 'simple' ? 'scan.simple' : 'scan.pro');
    document.getElementById('scan-file').textContent = fileName;
    document.getElementById('scan-steps').innerHTML = '';
    setProgress(progress || '');
    go('scan');
  }
  function setProgress(msg) { document.getElementById('scan-progress').textContent = msg; }

  function startDemo(key) {
    const result = demoResult(key);
    showScanning(result.file);
    if (mode === 'simple') {
      setTimeout(() => showResult(result), 2200);
      return;
    }
    const list = document.getElementById('scan-steps');
    ['step.1', 'step.2', 'step.3', 'step.4'].forEach(k => { const li = document.createElement('li'); li.textContent = t(k); list.appendChild(li); });
    const items = list.children;
    let i = 0;
    const tick = () => {
      if (i > 0) items[i - 1].className = 'done';
      if (i < items.length) { items[i].className = 'now'; i++; setTimeout(tick, 600); }
      else setTimeout(() => showResult(result), 300);
    };
    tick();
  }

  function fmtTime(sec) {
    const s = Math.round(sec);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function showResult(d) {
    current = d;
    if (mode === 'simple') {
      document.getElementById('rs-card').className = 'verdict-card v-' + d.verdict;
      document.getElementById('rs-icon').innerHTML = ICONS[d.verdict];
      document.getElementById('rs-title').textContent = d.simpleTitle;
      document.getElementById('rs-line').textContent = d.simpleLine;
      document.getElementById('rs-share').textContent = t(d.verdict === 'real' ? 'rs.shareReal' : 'rs.shareWarn');
      document.getElementById('rs-web').style.display = d.preview ? '' : 'none';
      go('result-simple');
      return;
    }

    const ring = document.getElementById('rp-ring');
    ring.style.transition = 'none';
    ring.setAttribute('stroke', COLORS[d.verdict]);
    ring.setAttribute('stroke-dasharray', '0 100');
    document.getElementById('rp-pct').textContent = d.pct == null ? '?' : d.pct + '%';
    document.getElementById('rp-title').textContent = d.proTitle;
    document.getElementById('rp-title').style.color = COLORS[d.verdict];
    document.getElementById('rp-sub').textContent = d.proSub;
    document.getElementById('rp-badge').innerHTML = d.live
      ? `<span class="badge-live">${t('badge.live')}</span>`
      : `<span class="badge-demo">${t('badge.demo')}</span>`;

    document.getElementById('rp-web-card').style.display = d.preview ? '' : 'none';
    const heatCard = document.getElementById('rp-heat-card');
    heatCard.style.display = d.heat ? '' : 'none';
    if (d.heat) {
      document.getElementById('rp-heat-img').src = d.preview;
      document.getElementById('rp-heat-grid').innerHTML = d.heat.map(({ p, flagged }) => {
        const color = flagged ? 'rgba(226, 75, 74, 0.7)'
          : p >= 0.5 ? `rgba(239, 159, 39, ${(0.15 + (p - 0.5) * 0.6).toFixed(2)})` : 'rgba(93, 202, 165, 0.12)';
        return `<div style="background:${color}${flagged ? ';outline:3px solid #E24B4A;outline-offset:-3px' : ''}"></div>`;
      }).join('');
    }

    const tlCard = document.getElementById('rp-timeline-card');
    tlCard.style.display = d.total ? '' : 'none';
    if (d.total) {
      document.getElementById('rp-timeline').innerHTML = d.segments
        .map(([a, b]) => `<div class="seg" style="left:${a / d.total * 100}%;width:${(b - a) / d.total * 100}%"></div>`).join('');
      document.getElementById('rp-duration').textContent = fmtTime(d.total);
      const marks = document.getElementById('rp-marks');
      marks.innerHTML = '';
      if (!d.marks.length) d.marks = [[null, t('rp.none')]];
      d.marks.forEach(([at, txt]) => {
        const row = document.createElement('div');
        row.innerHTML = '<span></span><span class="t"></span>';
        row.children[0].textContent = txt;
        row.children[1].textContent = at == null ? '' : fmtTime(at);
        marks.appendChild(row);
      });
    }

    document.getElementById('rp-bars').parentElement.style.display = d.bars.length ? '' : 'none';
    document.getElementById('rp-bars-title').textContent =t(d.kind === 'video' && d.live ? 'rp.frames' : 'rp.details');
    document.getElementById('rp-bars').innerHTML = d.bars.map(([name, p]) => {
      const c = p >= 70 ? COLORS.fake : p >= 40 ? COLORS.maybe : COLORS.real;
      return `<div class="bar-row"><div class="bar-head"><span>${name}</span><span class="p">${p}%</span></div>` +
             `<div class="bar"><i style="width:${p}%;background:${c}"></i></div></div>`;
    }).join('');

    go('result-pro');
    requestAnimationFrame(() => setTimeout(() => {
      ring.style.transition = 'stroke-dasharray .9s ease-out';
      ring.setAttribute('stroke-dasharray', (d.pct || 0) + ' 100');
    }, 50));
  }

  // ---------- Web check: reverse image search ----------
  // A free automatic web check would need a paid API with a secret key, which a public page can't hold.
  // So the user picks a search site: on phones we hand the image to the share sheet (Google Lens appears
  // there); on computers we copy it to the clipboard and open the site, where Ctrl+V pastes it.
  const WEB_SEARCH = {
    lens: 'https://lens.google.com/',
    bing: 'https://www.bing.com/visualsearch',
    tineye: 'https://tineye.com/'
  };

  async function webSearch(engine) {
    const d = current;
    if (!d || !d.preview) return;
    const img = new Image();
    img.src = d.preview;
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

    const file = new File([blob], 'image.png', { type: 'image/png' });
    if (engine === 'lens' && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    let copied = false;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      copied = true;
    } catch (e) { /* clipboard not allowed: the user uploads on the site instead */ }
    window.open(WEB_SEARCH[engine], '_blank');
    toast(t(copied ? 'web.copied' : 'web.upload'));
  }

  const APP_URL = 'https://steinfeldan-max.github.io/fakebreak/';

  // Draw a 1080×1080 result card (verdict only, never the user's file) for sharing.
  function shareImage(d) {
    const S = 1080;
    const canvas = document.createElement('canvas');
    canvas.width = S;
    canvas.height = S;
    const ctx = canvas.getContext('2d');
    const font = (size, weight = 500) => `${weight} ${size}px Rubik, system-ui, sans-serif`;
    ctx.fillStyle = '#26215C';
    ctx.fillRect(0, 0, S, S);

    // Logo
    ctx.textAlign = 'center';
    ctx.direction = 'ltr';
    ctx.font = font(64, 700);
    const fakeW = ctx.measureText('Fake').width, breakW = ctx.measureText('Break').width;
    const x0 = S / 2 - (fakeW + breakW) / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('Fake', x0, 130);
    ctx.fillStyle = '#F0997B';
    ctx.fillRect(x0, 108, fakeW, 7);
    ctx.fillText('Break', x0 + fakeW, 130);

    // Verdict circle with icon
    const color = COLORS[d.verdict];
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(S / 2, 360, 150, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 26;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (d.verdict === 'fake') {
      ctx.moveTo(S / 2 - 60, 300); ctx.lineTo(S / 2 + 60, 420);
      ctx.moveTo(S / 2 + 60, 300); ctx.lineTo(S / 2 - 60, 420);
    } else if (d.verdict === 'real') {
      ctx.moveTo(S / 2 - 70, 365); ctx.lineTo(S / 2 - 20, 415); ctx.lineTo(S / 2 + 75, 305);
    } else {
      ctx.arc(S / 2, 325, 42, Math.PI * 1.1, Math.PI * 2.4);
      ctx.lineTo(S / 2, 395);
      ctx.moveTo(S / 2, 450); ctx.lineTo(S / 2, 451);
    }
    ctx.stroke();

    // Title, percentage, explanation (wrapped)
    ctx.textAlign = 'center';
    ctx.direction = RTL.includes(lang) ? 'rtl' : 'ltr';
    ctx.fillStyle = color;
    ctx.font = font(76, 700);
    ctx.fillText(d.simpleTitle, S / 2, 640);
    let y = 720;
    if (d.pct != null) {
      ctx.fillStyle = '#FFFFFF';
      ctx.font = font(48);
      ctx.fillText(`AI ${d.pct}%`, S / 2, y);
      y += 80;
    }
    ctx.fillStyle = '#EEEDFE';
    ctx.font = font(38, 400);
    const words = d.simpleLine.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > S - 180 && line) {
        ctx.fillText(line, S / 2, y);
        y += 54;
        line = w;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, S / 2, y);

    // Footer
    ctx.fillStyle = '#AFA9EC';
    ctx.font = font(32, 400);
    ctx.fillText(t('share.footer'), S / 2, S - 90);
    ctx.direction = 'ltr';
    ctx.fillText(APP_URL.replace('https://', '').replace(/\/$/, ''), S / 2, S - 45);
    return canvas;
  }

  // Share the result: the phone's share sheet (pick WhatsApp) with the image, or WhatsApp with text as a fallback.
  async function share() {
    const d = current;
    if (!d) return;
    const text = t('share.text', { verdict: d.simpleTitle + (d.pct != null ? ` (AI ${d.pct}%)` : '') }) + ' ' + APP_URL;
    try {
      const blob = await new Promise(res => shareImage(d).toBlob(res, 'image/png'));
      const file = new File([blob], 'fakebreak-result.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text });
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return; // user closed the share sheet
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
</script>
